wxt_ext_editor_alert:
  ckeditor5:
    plugins:
      - wxt_alert.Alert
  drupal:
    label: WET Alert
    library: wxt_ext_editor/alert
    admin_library: wxt_ext_editor/admin.wxt_ext_editor
    toolbar_items:
      alert:
        label: WET Alert
    elements:
      - <h2>
      - <h2 class>
      - <h3>
      - <h3 class>
      - <div>
      - <section>
      - <section class>

wxt_ext_editor_panel:
  ckeditor5:
    plugins:
      - wxt_panel.Panel
  drupal:
    label: WET Panel
    library: wxt_ext_editor/panel
    admin_library: wxt_ext_editor/admin.wxt_ext_editor
    toolbar_items:
      panel:
        label: WET Panel
    elements:
      - <section>
      - <section class>
      - <header>
      - <header class>
      - <details>
      - <details class>

wxt_ext_editor_tabs:
  ckeditor5:
    plugins:
      - wxt_tabs.WXTTabs
  drupal:
    label: WET Tabs
    library: wxt_ext_editor/tabs
    admin_library: wxt_ext_editor/admin.wxt_ext_editor
    toolbar_items:
      insertWXTTabs:
        label: WET Tabs
    elements:
      - <div class>

wxt_ext_editor_conjunctions:
  ckeditor5:
    plugins:
      - wxt_conjunctions.Conjunction
  drupal:
    label: And/Or
    library: wxt_ext_editor/conjunctions
    admin_library: wxt_ext_editor/admin.wxt_ext_editor
    toolbar_items:
      conjunction:
        label: And/Or
    elements:
      - <div class>
      - <ul class>
      - <li class>

wxt_ext_editor_cite:
  ckeditor5:
    plugins:
      - cite.CitePlugin
  drupal:
    label: Cite
    library: wxt_ext_editor/cite
    admin_library: wxt_ext_editor/admin.wxt_ext_editor
    toolbar_items:
      cite:
        label: Cite
    elements:
      - <cite>


